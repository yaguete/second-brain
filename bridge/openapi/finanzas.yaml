  /v1/budget-vs-actual:
    get:
      operationId: getBudgetVsActual
      summary: Compare budgeted amounts vs actual spending
      parameters:
        - in: query
          name: budget_id
          required: true
          schema: { type: string }
        - in: query
          name: month
          required: false
          schema: { type: string, default: "current", description: "month to analyze" }
        - in: query
