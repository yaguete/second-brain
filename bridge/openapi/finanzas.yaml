          required: true
          schema: { type: string }
        - in: query
          name: since_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
        - in: query
          name: until_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
        - in: query
          name: group_by
