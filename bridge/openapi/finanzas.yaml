        - in: query
          name: exclude_payee_names
          required: false
          schema: { type: string, description: "comma-separated payee name substrings to exclude" }
      responses:
        "200":
          description: Sum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionsSumResponse" }

  /v1/market-pnl:
    get:
