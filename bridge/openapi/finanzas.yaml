          required: true
          schema: { type: string }
        - in: query
          name: budget_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionResponse" }

  /v1/savings-rate:
    get:
      operationId: getSavingsRate
      summary: Calculate savings rate (income - expenses) / income
      parameters:
        - in: query
          name: budget_id
          required: true
          schema: { type: string }
        - in: query
          name: since_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
        - in: query
          name: until_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
      responses:
        "200":
          description: Savings rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  since_date: { type: string }
                  until_date: { type: string }
                  income: { type: number }
                  expenses: { type: number }
                  savings: { type: number }
                  savings_rate: { type: number, description: "percentage (0-100)" }

  /v1/recurring-expenses:
    get:
      operationId: getRecurringExpenses
      summary: Detect recurring expenses/subscriptions
      parameters:
        - in: query
          name: budget_id
          required: true
          schema: { type: string }
        - in: query
          name: months
          required: false
          schema: { type: integer, default: 3, description: "months to analyze" }
        - in: query
          name: min_occurrences
          required: false
          schema: { type: integer, default: 2, description: "minimum months present" }
        - in: query
          name: variance_threshold
          required: false
          schema: { type: integer, default: 20, description: "max variance percent for similar amounts" }
      responses:
        "200":
          description: Recurring expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  months_analyzed: { type: integer }
                  since_date: { type: string }
                  recurring_count: { type: integer }
                  recurring:
                    type: array
                    items:
                      type: object
                      properties:
                        payee_id: { type: string }
                        payee_name: { type: string }
                        occurrences: { type: integer }
                        months_present: { type: integer }
                        avg_amount: { type: number }
                        last_date: { type: string }

  /v1/spending-anomalies:
    get:
      operationId: getSpendingAnomalies
      summary: Find categories with unusual spending
      parameters:
        - in: query
          name: budget_id
          required: true
          schema: { type: string }
        - in: query
          name: month
          required: false
          schema: { type: string, default: "current", description: "month to analyze" }
        - in: query
          name: threshold
          required: false
          schema: { type: integer, default: 50, description: "percent above average to flag" }
      responses:
        "200":
          description: Spending anomalies
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  threshold_percent: { type: number }
                  months_compared: { type: integer }
                  anomaly_count: { type: integer }
                  anomalies:
                    type: array
                    items:
                      type: object
                      properties:
                        category_id: { type: string }
                        category_name: { type: string }
                        category_group: { type: string }
                        current_spending: { type: number }
                        avg_spending: { type: number }
                        deviation_percent: { type: integer }
                        excess: { type: number }

  /v1/net-worth-history:
    get:
