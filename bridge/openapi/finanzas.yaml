        "200":
          description: Budget vs actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  total_budgeted: { type: number }
                  total_spent: { type: number }
                  over_budget_count: { type: integer }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        category_id: { type: string }
                        category_name: { type: string }
                        category_group: { type: string }
                        budgeted: { type: number }
                        spent: { type: number }
                        remaining: { type: number }
                        percent_used: { type: integer }
                        status: { type: string, description: "over_budget | warning | on_track | under_utilized" }

