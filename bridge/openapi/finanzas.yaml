          name: budget_id
          required: true
          schema: { type: string }
        - in: query
          name: account_id
          required: true
          schema: { type: string, description: "Investment/brokerage account ID" }
        - in: query
          name: since_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
        - in: query
          name: until_date
          required: true
          schema: { type: string, description: "YYYY-MM-DD" }
      responses:
        "200":
          description: Market P&L
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  account_name: { type: string }
                  since_date: { type: string }
                  until_date: { type: string }
                  reconciliation_count: { type: integer }
